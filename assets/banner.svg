<svg xmlns="http://www.w3.org/2000/svg" width="3400" height="920" viewBox="0 0 3400 920" role="img" aria-label="Krishiv Mahajan  Full Stack Developer">
  <defs>
    <pattern id="topo" width="420" height="280" patternUnits="userSpaceOnUse">
      <path d="M0 140 C70 90,140 90,210 140 S350 190,420 140" fill="none" stroke="#2A2A2A" stroke-width="2"/>
      <path d="M0 180 C70 130,140 130,210 180 S350 230,420 180" fill="none" stroke="#242424" stroke-width="2"/>
      <path d="M0 100 C70 50,140 50,210 100 S350 150,420 100" fill="none" stroke="#2E2E2E" stroke-width="2"/>
      <path d="M0 220 C80 170,160 170,240 220 S360 270,420 220" fill="none" stroke="#222222" stroke-width="2"/>
      <path d="M0 60 C90 20,180 20,270 60 S390 100,420 60" fill="none" stroke="#2C2C2C" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="3400" height="920" fill="#0A0A0A"/>
  <rect width="3400" height="920" fill="url(#topo)"/>

  <!-- Name + role -->
  <text x="180" y="430" fill="#FFFFFF" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="140" font-weight="600" letter-spacing="-2">Krishiv Mahajan</text>
  <text x="185" y="540" fill="#E8E8E8" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="400">Full Stack Developer</text>

  <!-- Pixel rocket mark (outline) -->
  <g transform="translate(2860, 280)" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round">
    <!-- body -->
    <path d="M80 40 L120 40 L140 80 L140 200 L120 240 L40 240 L20 200 L20 80 Z"/>
    <!-- nose -->
    <path d="M40 40 L80 0 L120 40"/>
    <!-- window -->
    <rect x="60" y="100" width="40" height="40"/>
    <!-- fins -->
    <path d="M20 160 L0 220 L20 200"/>
    <path d="M140 160 L160 220 L140 200"/>
    <!-- flame -->
    <path d="M50 240 L80 300 L110 240"/>
    <path d="M65 240 L80 270 L95 240"/>
  </g>
</svg>
